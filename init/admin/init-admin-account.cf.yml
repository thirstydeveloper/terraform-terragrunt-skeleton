---
# https://www.terraform.io/docs/backends/types/s3.html
AWSTemplateFormatVersion: '2010-09-09'
Description: Initialize terraform admin account
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Admin Account Config
        Parameters:
          - AdminAccountId
      - Label:
          default: Terraform State Resources
        Parameters:
          - StateBucketName
          - StateAuditLogBucketName
          - StateAuditTrailName
Parameters:
  AdminAccountId:
    Type: String
    Description: Account ID of the admin account to contain the state
  StateBucketName:
    Type: String
    Description: Name of the S3 bucket for terraform state
  StateAuditLogBucketName:
    Type: String
    Description: Name of the S3 bucket for CloudTrail logs of terraform state access
  StateAuditTrailName:
    Type: String
    Default: terraform-state-audit
    Description: Name of the CloudTrail trail auditing terraform state access

Rules:
  EnsureDeployingToCorrectAccount:
    Assertions:
      - Assert: !Equals
          - !Ref AWS::AccountId
          - !Ref AdminAccountId
        AssertDescription: 'Stack can only be deployed into the specified AdminAccountId'

Resources:
  # Customer managed key for the CloudTrail trail that audits access to the
  # state bucket. Who can decrypt is controlled through IAM: the key policy
  # delegates to the account and only grants CloudTrail what it needs to
  # encrypt log files for the one trail.
  # https://docs.aws.amazon.com/awscloudtrail/latest/userguide/create-kms-key-policy-for-cloudtrail.html
  TerraformStateAuditKey:
    Type: 'AWS::KMS::Key'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts CloudTrail logs of terraform state bucket access
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudTrailEncryptLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 'kms:GenerateDataKey*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceArn': !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${StateAuditTrailName}"
              StringLike:
                'kms:EncryptionContext:aws:cloudtrail:arn': !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*"
          - Sid: AllowCloudTrailDescribeKey
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceArn': !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${StateAuditTrailName}"

  TerraformStateAuditKeyAlias:
    Type: 'AWS::KMS::Alias'
    Properties:
      AliasName: alias/terraform-state-audit
      TargetKeyId: !Ref TerraformStateAuditKey

  TerraformStateAuditLogBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref StateAuditLogBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt TerraformStateAuditKey.Arn
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True
      VersioningConfiguration:
        Status: Enabled

  # https://docs.aws.amazon.com/awscloudtrail/latest/userguide/create-s3-bucket-policy-for-cloudtrail.html
  TerraformStateAuditLogBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref TerraformStateAuditLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowTLSRequestsOnly
            Principal: '*'
            Condition:
              Bool:
                'aws:SecureTransport': false
            Effect: Deny
            Action: '*'
            Resource:
              - !GetAtt TerraformStateAuditLogBucket.Arn
              - !Sub "${TerraformStateAuditLogBucket.Arn}/*"
          # Reject writes that don't explicitly encrypt with the audit key.
          # StringNotEquals is also true when the header is absent, so puts
          # relying on bucket default encryption are rejected too.
          - Sid: DenyNonKMSEncryptedPuts
            Principal: '*'
            Effect: Deny
            Action: 's3:PutObject'
            Resource: !Sub "${TerraformStateAuditLogBucket.Arn}/*"
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': aws:kms
          - Sid: DenyPutsWithOtherKMSKeys
            Principal: '*'
            Effect: Deny
            Action: 's3:PutObject'
            Resource: !Sub "${TerraformStateAuditLogBucket.Arn}/*"
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption-aws-kms-key-id':
                  - !GetAtt TerraformStateAuditKey.Arn
                  - !Ref TerraformStateAuditKey
          - Sid: AllowCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:GetBucketAcl'
            Resource: !GetAtt TerraformStateAuditLogBucket.Arn
            Condition:
              StringEquals:
                'aws:SourceArn': !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${StateAuditTrailName}"
          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub "${TerraformStateAuditLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceArn': !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${StateAuditTrailName}"

  # Records object-level access (reads, writes, lock file create/delete) to
  # the state bucket. Management events are excluded to keep the trail
  # scoped to state; add a management event selector to also audit changes
  # to bucket configuration.
  TerraformStateAuditTrail:
    Type: 'AWS::CloudTrail::Trail'
    DependsOn: TerraformStateAuditLogBucketPolicy
    Properties:
      TrailName: !Ref StateAuditTrailName
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: false
      EnableLogFileValidation: true
      S3BucketName: !Ref TerraformStateAuditLogBucket
      KMSKeyId: !GetAtt TerraformStateAuditKey.Arn
      AdvancedEventSelectors:
        - Name: Terraform state object access
          FieldSelectors:
            - Field: eventCategory
              Equals:
                - Data
            - Field: resources.type
              Equals:
                - 'AWS::S3::Object'
            # The trailing slash matters: without it, the prefix would also
            # match other buckets whose names start with the state bucket's,
            # such as the log buckets.
            - Field: resources.ARN
              StartsWith:
                - !Sub "arn:${AWS::Partition}:s3:::${StateBucketName}/"

  TerraformStateBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref StateBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True
      VersioningConfiguration:
        Status: Enabled

  TerraformStateReadWritePolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: TerraformStateReadWrite
      Path: /terraform/
      Description: Read/write access to terraform state
      PolicyDocument:
        Version: 2012-10-17
        # Permissions are based on:
        # https://www.terraform.io/docs/backends/types/s3.html#example-configuration
        # https://github.com/gruntwork-io/terragrunt/issues/919
        Statement:
          - Sid: AllowStateBucketList
            Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:GetBucketVersioning'
            Resource: !Sub "arn:aws:s3:::${StateBucketName}"
          - Sid: AllowStateReadWrite
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
            Resource: !Sub "arn:aws:s3:::${StateBucketName}/*"
          # S3 native state locking (use_lockfile) releases a lock by deleting
          # its <state key>.tflock object. Scope deletes to lock files only.
          - Sid: AllowStateLockFileDelete
            Effect: Allow
            Action:
              - 's3:DeleteObject'
            Resource: !Sub "arn:aws:s3:::${StateBucketName}/*.tflock"

  TerraformBackendRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref AWS::AccountId
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                aws:PrincipalType: User
              StringLike:
                'aws:PrincipalTag/Terraformer': '*'
      RoleName: TerraformBackend
      Path: /terraform/
      ManagedPolicyArns:
        - !Ref TerraformStateReadWritePolicy

  TerraformStateBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          ################################################
          # Require TLS always
          ################################################

          - Sid: 'AllowTLSRequestsOnly'
            Principal: '*'
            Condition:
              Bool:
                'aws:SecureTransport': false
            Effect: Deny
            Action: '*'
            Resource:
              - !GetAtt "TerraformStateBucket.Arn"
              - !Sub
                - "${Bucket}/*"
                - Bucket: !GetAtt "TerraformStateBucket.Arn"

          ################################################
          # User permissions
          ################################################

          # If principal is an IAM user and that user does
          # not have the Terraformer tag, deny everything
          - Sid: DenyNonTerraformerUsers
            Principal: "*"
            Condition:
              StringEquals:
                aws:PrincipalType: User
              StringNotLike:
                'aws:PrincipalTag/Terraformer': '*'
            Effect: Deny
            Action: '*'
            Resource:
              - !GetAtt "TerraformStateBucket.Arn"
              - !Sub
                - "${Bucket}/*"
                - Bucket: !GetAtt "TerraformStateBucket.Arn"

          # If principal is an IAM user and that user has the Terraformer tag,
          # but the tag value is not set to Admin, limit to read/write access.
          # By extension, if the user has the Terraformer tag set to Admin, this
          # policy places no restriction, granting that user whatever access is
          # specified in their IAM user policy.
          - Sid: RestrictTerraformNonAdmins
            Principal: "*"
            Condition:
              StringEquals:
                aws:PrincipalType: User
              StringLike:
                'aws:PrincipalTag/Terraformer': '*'
              StringNotEquals:
                'aws:PrincipalTag/Terraformer': 'Admin'
            Effect: Deny
            NotAction:
              - 's3:List*'
              - 's3:Get*'
              - 's3:Describe*'
              - 's3:PutObject'
              # Granting DeleteObject is safe because we have versioning enabled
              # on the bucket. DeleteObjectVersion is what we have to restrict
              # so that someone can't delete the delete marker and thereby
              # permanently delete state. Granting DeleteObject is helpful
              # because it allows NonAdmins to migrate state (i.e., rename state
              # files)
              - 's3:DeleteObject'
            Resource:
              - !GetAtt "TerraformStateBucket.Arn"
              - !Sub
                - "${Bucket}/*"
                - Bucket: !GetAtt "TerraformStateBucket.Arn"

          ################################################
          # Role permissions
          ################################################

          # https://aws.amazon.com/blogs/security/how-to-restrict-amazon-s3-bucket-access-to-a-specific-iam-role/

          # If the principal is an assumed IAM role and that role is not the
          # backend role, deny access.
          - Sid: DenyNonBackendRoles
            Principal: "*"
            Condition:
              StringEquals:
                aws:PrincipalType: AssumedRole
              StringNotLike:
                aws:userId:
                  - !Sub
                    - "${TerraformBackendRoleId}:*"
                    - TerraformBackendRoleId: !GetAtt "TerraformBackendRole.RoleId"
            Effect: Deny
            Action: '*'
            Resource:
              - !GetAtt "TerraformStateBucket.Arn"
              - !Sub
                - "${Bucket}/*"
                - Bucket: !GetAtt "TerraformStateBucket.Arn"

          # If the principal is an assumed IAM role and that role is the
          # backend role, limit to read/write access.
          - Sid: RestrictBackendRoleToReadWrite
            Principal: "*"
            Condition:
              StringEquals:
                aws:PrincipalType: AssumedRole
              StringLike:
                aws:userId:
                  - !Sub
                    - "${TerraformBackendRoleId}:*"
                    - TerraformBackendRoleId: !GetAtt "TerraformBackendRole.RoleId"
            Effect: Deny
            NotAction:
              - 's3:ListBucket'
              - 's3:GetBucketVersioning'
              - 's3:GetObject'
              - 's3:PutObject'
              # Scoped to lock files by RestrictBackendRoleDeleteToLockFiles
              - 's3:DeleteObject'
            Resource:
              - !GetAtt "TerraformStateBucket.Arn"
              - !Sub
                - "${Bucket}/*"
                - Bucket: !GetAtt "TerraformStateBucket.Arn"

          # S3 native state locking (use_lockfile) releases a lock by deleting
          # its <state key>.tflock object. Deny the backend role deleting
          # anything else.
          - Sid: RestrictBackendRoleDeleteToLockFiles
            Principal: "*"
            Condition:
              StringEquals:
                aws:PrincipalType: AssumedRole
              StringLike:
                aws:userId:
                  - !Sub
                    - "${TerraformBackendRoleId}:*"
                    - TerraformBackendRoleId: !GetAtt "TerraformBackendRole.RoleId"
            Effect: Deny
            Action: 's3:DeleteObject'
            NotResource: !Sub
              - "${Bucket}/*.tflock"
              - Bucket: !GetAtt "TerraformStateBucket.Arn"

          ################################################
          # Default deny
          ################################################

          # https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_variables.html#principaltable

          - Sid: DenyAllOtherPrincipals
            Principal: "*"
            Condition:
              StringNotEquals:
                aws:PrincipalType:
                  - AssumedRole
                  - Account
                  - User
            Effect: Deny
            Action: '*'
            Resource:
              - !GetAtt "TerraformStateBucket.Arn"
              - !Sub
                - "${Bucket}/*"
                - Bucket: !GetAtt "TerraformStateBucket.Arn"
